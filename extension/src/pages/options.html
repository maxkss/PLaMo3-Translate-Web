<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLaMo Translate 설정</title>
    <link rel="stylesheet" href="pages.css" />
    <style>
      main { max-width: 680px; margin: 0 auto; padding: 32px 16px; display: flex; flex-direction: column; gap: 16px; }
      h1 { font-size: 20px; line-height: 28px; font-weight: 600; }
      footer { display: flex; flex-wrap: wrap; gap: 4px 12px; padding-top: 4px; }
      footer a { text-decoration: none; }
      footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <h1>PLaMo Translate</h1>

      <div class="settings">
        <section class="group">
          <h2 class="group-title">모델</h2>
          <ul class="rows">
            <li class="set-row">
              <div class="set-line">
                <div class="set-text"><span class="set-title">번역 모델</span><span class="set-desc" id="modelInfo"></span></div>
                <div class="set-control">
                  <div class="seg sm" role="radiogroup" aria-label="번역 모델">
                    <label data-text="0.8B"><input type="radio" name="model" value="0.8b" />0.8B</label>
                    <label data-text="2B"><input type="radio" name="model" value="2b" />2B</label>
                  </div>
                </div>
              </div>
            </li>
            <li class="set-row">
              <div class="set-line">
                <div class="set-text"><span class="set-title">이미지 글자 인식</span><span class="set-desc" id="ocrInfo"></span></div>
                <div class="set-control">
                  <div class="seg sm" role="radiogroup" aria-label="이미지 글자 인식">
                    <label data-text="가벼움"><input type="radio" name="ocrModel" value="mobile" />가벼움</label>
                    <label data-text="정확함"><input type="radio" name="ocrModel" value="server" />정확함</label>
                  </div>
                </div>
              </div>
            </li>
            <li class="set-row">
              <div class="set-line">
                <div class="set-text"><span class="set-title">설치</span><span class="set-desc" id="installInfo"></span></div>
                <div class="set-control">
                  <button id="cancelDl" class="btn sm hidden">취소</button>
                  <button id="download" class="btn sm primary">내려받기</button>
                </div>
              </div>
              <div class="bar hidden" id="bar"><i></i></div>
            </li>
          </ul>
        </section>

        <section class="group">
          <h2 class="group-title">실행</h2>
          <ul class="rows">
            <li class="set-row">
              <div class="set-line">
                <div class="set-text"><span class="set-title">엔진</span><span class="set-desc status"><span class="dot" id="dot"></span><span id="status">엔진 연결 중…</span></span></div>
                <div class="set-control">
                  <button id="load" class="btn sm">불러오기</button>
                  <button id="unload" class="btn sm">내리기</button>
                </div>
              </div>
            </li>
            <li class="set-row">
              <div class="set-line">
                <div class="set-text"><span class="set-title">실행 장치</span></div>
                <div class="set-control">
                  <div class="seg sm" role="radiogroup" aria-label="실행 장치">
                    <label data-text="자동"><input type="radio" name="backend" value="auto" />자동</label>
                    <label data-text="GPU"><input type="radio" name="backend" value="webgpu" />GPU</label>
                    <label data-text="CPU"><input type="radio" name="backend" value="wasm" />CPU</label>
                  </div>
                </div>
              </div>
            </li>
            <li class="set-row">
              <div class="set-line">
                <div class="set-text"><span class="set-title">쓰지 않으면 메모리에서 내리기</span></div>
                <div class="set-control">
                  <span class="select sm"><select id="idleUnload" aria-label="쓰지 않으면 메모리에서 내리기"></select></span>
                </div>
              </div>
            </li>
          </ul>
        </section>

        <section class="group">
          <h2 class="group-title">저장 공간</h2>
          <ul class="rows">
            <li class="set-row">
              <div class="set-line">
                <div class="set-text"><span class="set-title">모델 삭제</span><span class="set-desc" id="deleteInfo"></span></div>
                <div class="set-control"><button id="delete" class="btn sm destructive">삭제</button></div>
              </div>
            </li>
          </ul>
        </section>
      </div>

      <footer class="secondary">
        <a id="baseLink" target="_blank" rel="noreferrer">원본 모델</a>
        <a id="repoLink" target="_blank" rel="noreferrer">변환 모델</a>
        <a href="https://plamo.preferredai.jp/info/plamo-community-license-ja" target="_blank" rel="noreferrer">PLaMo Community License</a>
        <span>Built with PLaMo</span>
      </footer>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
