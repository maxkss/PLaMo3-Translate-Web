<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>PLaMo Translate</title>
    <link rel="stylesheet" href="pages.css" />
    <style>
      /* the popup takes the inner (card) colour of the other surfaces; its switch rows sit on it directly */
      body { width: 320px; background: var(--bg-muted); }
      .rows { background: transparent; border: 0; border-radius: 0; }
      .rows > li + li { border-top: 0; }
      main { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
      header { display: flex; align-items: center; gap: 8px; margin-right: -6px; }
      header h1 { flex: 1; font-size: 14px; line-height: 20px; }
      .rows .set-row { padding: 4px 0; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>PLaMo Translate</h1>
        <button class="btn ghost icon sm" id="options" title="설정"><i data-icon="settings"></i></button>
      </header>

      <div id="notice" class="banner error hidden" role="status">
        <span id="noticeIcon" style="display: contents"></span><span class="title" id="noticeText"></span>
        <button class="btn sm" id="noticeAction">설치</button>
      </div>

      <span class="select"><select id="lang" title="번역할 언어"></select></span>

      <div class="seg fill" role="radiogroup" aria-label="페이지 번역 표시">
        <label data-text="원문 + 번역"><input type="radio" name="mode" value="dual" />원문 + 번역</label>
        <label data-text="번역만"><input type="radio" name="mode" value="replace" />번역만</label>
      </div>

      <button id="page" class="btn primary lg block" title="Alt+Shift+T">이 페이지 번역</button>

      <ul class="rows">
        <li class="set-row">
          <label class="set-line" title="Alt+T"><span class="set-text"><span class="set-title">선택하면 번역 버튼</span></span><input type="checkbox" class="switch" id="selButton" /></label>
        </li>
        <li class="set-row">
          <label class="set-line"><span class="set-text"><span class="set-title">선택하면 바로 번역</span></span><input type="checkbox" class="switch" id="selAuto" /></label>
        </li>
      </ul>

      <div id="statusBox" style="display: flex; flex-direction: column; gap: 8px">
        <div class="status"><span class="dot" id="dot"></span><span id="status">엔진 연결 중…</span></div>
        <div class="bar hidden" id="bar"><i></i></div>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
