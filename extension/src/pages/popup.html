<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>PLaMo Translate</title>
    <link rel="stylesheet" href="pages.css" />
    <style>
      body { width: 320px; padding: 14px; }
      .stack { gap: 12px; }
      #page { width: 100%; padding: 9px; }
      select { width: 100%; }
    </style>
  </head>
  <body>
    <div class="stack">
      <div class="row" style="justify-content: space-between">
        <h1>PLaMo 3 Translate</h1>
        <span class="muted">온디바이스 · 2B</span>
      </div>

      <label class="stack" style="gap: 4px; align-items: stretch">
        <span class="muted">번역할 언어</span>
        <select id="lang"></select>
      </label>

      <div class="stack" style="gap: 4px">
        <span class="muted">페이지 번역 표시</span>
        <div class="seg">
          <input type="radio" name="mode" id="mode-dual" value="dual" /><label for="mode-dual">원문 + 번역</label>
          <input type="radio" name="mode" id="mode-replace" value="replace" /><label for="mode-replace">번역만</label>
        </div>
      </div>

      <button id="page" class="primary">이 페이지 번역</button>

      <div class="stack" style="gap: 6px">
        <label><input type="checkbox" id="selButton" /> 텍스트 선택 시 번역 버튼 표시</label>
        <label><input type="checkbox" id="selAuto" /> 선택하면 바로 번역</label>
      </div>

      <div class="card stack" style="gap: 6px; padding: 10px 12px">
        <div class="status"><span class="dot" id="dot"></span><span id="status">엔진 연결 중…</span></div>
        <div class="bar hidden" id="bar"><i></i></div>
        <a href="#" id="options" class="muted">모델 설정 · 테스트</a>
      </div>
      <div class="muted">단축키: Alt+Shift+T 페이지 번역, Alt+T 선택 영역 번역</div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
